<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kehinde & Simeon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Pinyon+Script&display=swap">
<style>
:root{--bg:#04150f;--emerald:#0b3d2e;--gold:#d9b45a;--gold-hi:#f3dc9c;--cream:#f6eedb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--bg);color:var(--cream);overflow:hidden;
font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif}
.script{font-family:"Pinyon Script","Snell Roundhand","Brush Script MT",cursive;font-weight:400}

/* INTRO */
#intro{position:fixed;inset:0;z-index:5;background:radial-gradient(ellipse at 50% 45%,#0e4a38 0%,#062a1f 45%,#020c08 100%);
transition:opacity 1.2s ease,transform 1.2s ease}
#intro.gone{opacity:0;transform:scale(1.15);pointer-events:none}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
#names{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;width:44vmin;max-width:300px;
pointer-events:none;line-height:1}
#names span{display:block;opacity:0;transform:scale(.8);filter:blur(8px);transition:opacity 1.6s ease,transform 1.6s ease,filter 1.6s ease;
color:var(--gold-hi);text-shadow:0 0 18px rgba(243,220,156,.55)}
#names .n{font-size:clamp(34px,10.5vmin,64px)}
#names .a{font-size:clamp(22px,6vmin,36px);margin:.12em 0;color:var(--cream)}
#names.show span{opacity:1;transform:none;filter:none}
#names.show span:nth-child(2){transition-delay:.5s}
#names.show span:nth-child(3){transition-delay:1s}
#skip{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:none;border:0;color:var(--gold);
font:inherit;font-size:16px;opacity:.7;padding:10px;cursor:pointer}
#skip:focus-visible,.cta:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}

/* MAIN */
#main{position:fixed;inset:0;z-index:2;transform:translateY(100%);transition:transform 1.4s cubic-bezier(.22,.8,.2,1)}
#main.up{transform:none}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.6s ease;overflow:hidden}
.slide.on{opacity:1}
.slide img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;transform:scale(1.04);transition:transform 7s linear}
.slide.on img{transform:scale(1.12)}
.veil{position:absolute;inset:0;background:linear-gradient(to top,rgba(2,12,8,.92) 0%,rgba(2,12,8,.55) 32%,rgba(2,12,8,0) 58%),
linear-gradient(to bottom,rgba(2,12,8,.45),rgba(2,12,8,0) 22%)}
.copy{position:absolute;left:0;right:0;bottom:0;padding:0 24px calc(36px + env(safe-area-inset-bottom,0px));text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.copy h1{margin:0;font-size:clamp(46px,13vw,92px);color:var(--gold-hi);line-height:1.05;text-shadow:0 2px 24px rgba(0,0,0,.6)}
.copy p{margin:0;font-size:clamp(19px,4.6vw,24px);font-style:italic;max-width:30ch;line-height:1.35;text-shadow:0 1px 12px rgba(0,0,0,.7)}
.cta{display:inline-block;margin-top:6px;padding:16px 38px;border-radius:999px;text-decoration:none;color:#1a1204;font-size:21px;font-weight:600;letter-spacing:.02em;
background:linear-gradient(135deg,#f3dc9c,#d9b45a 55%,#b88a2c);box-shadow:0 8px 30px rgba(217,180,90,.35);transition:transform .25s ease,box-shadow .25s ease}
.cta:hover{transform:translateY(-2px);box-shadow:0 12px 36px rgba(217,180,90,.5)}
.dots{display:flex;gap:9px;margin-top:8px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(246,238,219,.35);transition:all .4s}
.dots i.on{background:var(--gold-hi);width:22px;border-radius:4px}
@media (prefers-reduced-motion:reduce){.slide img,.slide.on img{transition:none;transform:none}#main{transition-duration:.01s}}
</style>
</head>
<body>

<section id="main" aria-label="Kehinde and Simeon wedding">
  <div id="slides"></div>
  <div class="veil"></div>
  <div class="copy">
    <h1 class="script">Kehinde &amp; Simeon</h1>
    <p>Every smile, every dance, every blessing, kept safe for you.</p>
    <a class="cta" href="https://drive.google.com/drive/folders/1a0n6YZ0kPPMY-B8n5JWL4Z0vOV6iCqco" target="_blank" rel="noopener">The memory is here</a>
    <div class="dots" id="dots"></div>
  </div>
</section>

<section id="intro" aria-label="Introduction">
  <canvas id="c"></canvas>
  <div id="names" aria-label="Kehinde and Simeon">
    <span class="script n">Kehinde</span><span class="a">&amp;</span><span class="script n">Simeon</span>
  </div>

</section>

(function(){
  var slidesEl=document.getElementById('slides'),dotsEl=document.getElementById('dots'),cur=0,timer=null;
  IMGS.forEach(function(src,i){
    var d=document.createElement('div');d.className='slide'+(i===0?' on':'');
    var im=document.createElement('img');im.src=src;im.alt='Kehinde and Simeon in emerald green and gold';d.appendChild(im);slidesEl.appendChild(d);
    var dot=document.createElement('i');if(i===0)dot.className='on';dotsEl.appendChild(dot);
  });
  var S=slidesEl.children,D=dotsEl.children;
  function go(n){S[cur].classList.remove('on');D[cur].classList.remove('on');cur=n%S.length;S[cur].classList.add('on');D[cur].classList.add('on');}
  function startCarousel(){if(!timer)timer=setInterval(function(){go(cur+1)},4800);}

  var done=false,intro=document.getElementById('intro'),main=document.getElementById('main'),names=document.getElementById('names');
  function finish(){
    if(done)return;done=true;
    intro.classList.add('gone');
    setTimeout(function(){main.classList.add('up');startCarousel();},500);
    setTimeout(function(){intro.style.display='none';if(window.__stop)window.__stop();},2000);
  }
  document.getElementById('skip').onclick=finish;
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;

  try{
    if(reduce||!window.THREE)throw 0;
    var cv=document.getElementById('c');
    var r=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
    r.setPixelRatio(Math.min(devicePixelRatio||1,2));
    var sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(35,1,.1,100);
    var grp=new THREE.Group();sc.add(grp);
    var gold=new THREE.MeshPhysicalMaterial({color:0xe2b955,metalness:.85,roughness:.22,clearcoat:.6,emissive:0x3a2606});
    var ring=new THREE.Mesh(new THREE.TorusGeometry(1.2,.13,40,140),gold);grp.add(ring);
    var gem=new THREE.Mesh(new THREE.OctahedronGeometry(.26,0),new THREE.MeshPhysicalMaterial({color:0xffffff,metalness:0,roughness:0,transparent:true,opacity:.92,emissive:0x8fd9ff,emissiveIntensity:.35}));
    gem.position.set(0,1.42,0);gem.scale.set(1,1.3,1);grp.add(gem);
    var prong=new THREE.Mesh(new THREE.CylinderGeometry(.1,.14,.18,12),gold);prong.position.set(0,1.27,0);grp.add(prong);
    sc.add(new THREE.AmbientLight(0xffffff,.5));
    var l1=new THREE.PointLight(0xfff0c8,1.6,30);l1.position.set(4,4,6);sc.add(l1);
    var l2=new THREE.PointLight(0x5fffc0,1.2,30);l2.position.set(-5,-2,4);sc.add(l2);
    var l3=new THREE.PointLight(0xffffff,1,30);l3.position.set(0,5,-4);sc.add(l3);
    var N=140,pg=new THREE.BufferGeometry(),pos=new Float32Array(N*3);
    for(var i=0;i<N;i++){pos[i*3]=(Math.random()-.5)*9;pos[i*3+1]=(Math.random()-.5)*9;pos[i*3+2]=(Math.random()-.5)*6-1;}
    pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
    var pts=new THREE.Points(pg,new THREE.PointsMaterial({color:0xf3dc9c,size:.035,transparent:true,opacity:.7}));sc.add(pts);
    function size(){
      var w=innerWidth,h=innerHeight;r.setSize(w,h,false);cam.aspect=w/h;
      var fov=cam.fov*Math.PI/180,want=Math.min(w,h*.62)*.84;
      var dist=(2.7/2)*(h/want)/Math.tan(fov/2);cam.position.set(0,0,dist);cam.updateProjectionMatrix();
    }
    size();addEventListener('resize',size);
    var t0=performance.now(),raf,shown=false,ease=function(x){return 1-Math.pow(1-x,3)};
    function loop(now){
      var t=(now-t0)/1000;
      var a=Math.min(t/2.6,1),e=ease(a);
      grp.scale.setScalar(.15+.85*e);
      var settle=Math.min(Math.max((t-2.2)/1.6,0),1),se=ease(settle);
      grp.rotation.y=(1-e)*Math.PI*4+(1-se)*0+Math.sin(t*.9)*.12*se;
      grp.rotation.x=(1-se)*.5+Math.sin(t*.7)*.05*se;
      grp.rotation.z=(1-e)*.6;
      grp.position.y=(1-e)*-1.2;
      gem.rotation.y=t*1.6;
      pts.rotation.y=t*.05;pts.position.y=Math.sin(t*.5)*.1;
      l1.position.x=4*Math.cos(t*.8);
      if(t>3.6&&!shown){shown=true;names.classList.add('show');}
      if(t>8.2)finish();
      r.render(sc,cam);raf=requestAnimationFrame(loop);
    }
    raf=requestAnimationFrame(loop);
    window.__stop=function(){cancelAnimationFrame(raf);r.dispose();};
  }catch(e){
    names.classList.add('show');setTimeout(finish,3600);
  }
})();
